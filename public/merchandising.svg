<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Georgia, serif">
  <defs>
    <radialGradient id="bgMain" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1e3a1e"/>
      <stop offset="100%" stop-color="#0a120a"/>
    </radialGradient>
    <radialGradient id="leafG" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#9de870"/>
      <stop offset="60%" stop-color="#5ab535"/>
      <stop offset="100%" stop-color="#2d6b1a"/>
    </radialGradient>
    <radialGradient id="mugGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a4a2a"/>
      <stop offset="100%" stop-color="#0d1a0d"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Símbolo de folha reutilizável -->
    <symbol id="leaf" viewBox="-60 -75 120 130">
      <path d="M0,-70 C-5,-50 -18,-40 -22,-20 C-14,-22 -8,-18 0,-5 C8,-18 14,-22 22,-20 C18,-40 5,-50 0,-70Z" fill="url(#leafG)"/>
      <path d="M-5,-42 C-20,-48 -40,-38 -48,-20 C-34,-22 -20,-20 -10,-10 C-8,-22 -6,-33 -5,-42Z" fill="url(#leafG)" opacity="0.9"/>
      <path d="M5,-42 C20,-48 40,-38 48,-20 C34,-22 20,-20 10,-10 C8,-22 6,-33 5,-42Z" fill="url(#leafG)" opacity="0.9"/>
      <path d="M-8,-22 C-28,-24 -55,-10 -58,12 C-42,6 -26,4 -14,10 C-10,-2 -8,-12 -8,-22Z" fill="url(#leafG)" opacity="0.85"/>
      <path d="M8,-22 C28,-24 55,-10 58,12 C42,6 26,4 14,10 C10,-2 8,-12 8,-22Z" fill="url(#leafG)" opacity="0.85"/>
      <path d="M-10,-2 C-30,2 -52,18 -50,40 C-36,30 -22,24 -12,24 C-10,14 -10,6 -10,-2Z" fill="url(#leafG)" opacity="0.8"/>
      <path d="M10,-2 C30,2 52,18 50,40 C36,30 22,24 12,24 C10,14 10,6 10,-2Z" fill="url(#leafG)" opacity="0.8"/>
      <rect x="-2" y="0" width="4" height="50" rx="2" fill="#2d6b1a"/>
    </symbol>
  </defs>

  <!-- Fundo -->
  <rect width="1000" height="720" fill="url(#bgMain)"/>

  <!-- Título geral -->
  <text x="500" y="38" text-anchor="middle" font-size="13" fill="#4a9e2f" letter-spacing="6" font-family="Arial, sans-serif">RACHID HEAD SHOP — VISUAL MERCHANDISING</text>
  <line x1="80" y1="48" x2="920" y2="48" stroke="#2d6b1a" stroke-width="0.8"/>

  <!-- ==================== CAMISETA ==================== -->
  <g filter="url(#shadow)" transform="translate(0,0)">
    <!-- Corpo da camiseta -->
    <path d="M90,120 L55,100 L30,160 L70,175 L70,280 L190,280 L190,175 L230,160 L205,100 L170,120
             C160,105 130,100 110,105 C100,105 95,112 90,120Z"
          fill="#111f11" stroke="#2d6b1a" stroke-width="1.5"/>
    <!-- Gola -->
    <path d="M110,105 Q130,125 150,105" fill="none" stroke="#2d6b1a" stroke-width="2"/>
    <!-- Logo na camiseta -->
    <use href="#leaf" x="130" y="195" width="70" height="90" transform="translate(130,195) scale(0.55)"/>
    <text x="130" y="250" text-anchor="middle" font-size="11" fill="#c8f07a" letter-spacing="3" font-family="Arial,sans-serif">RACHID</text>
    <text x="130" y="264" text-anchor="middle" font-size="7" fill="#5ab535" letter-spacing="2" font-family="Arial,sans-serif">HEAD SHOP</text>
  </g>
  <text x="130" y="300" text-anchor="middle" font-size="11" fill="#5ab535" font-family="Arial,sans-serif">CAMISETA PRETA</text>

  <!-- ==================== BONÉ ==================== -->
  <g filter="url(#shadow)" transform="translate(220,0)">
    <!-- Aba -->
    <path d="M60,200 Q130,230 200,200 L215,215 Q130,248 45,215Z" fill="#0d1a0d" stroke="#2d6b1a" stroke-width="1.2"/>
    <!-- Copa do boné -->
    <path d="M65,200 Q70,130 130,120 Q190,130 195,200Z" fill="#111f11" stroke="#2d6b1a" stroke-width="1.5"/>
    <!-- Botão no topo -->
    <circle cx="130" cy="125" r="5" fill="#2d6b1a" stroke="#5ab535" stroke-width="1"/>
    <!-- Suor band -->
    <path d="M68,197 Q130,205 192,197" fill="none" stroke="#1e3a1e" stroke-width="3"/>
    <!-- Logo no boné -->
    <use href="#leaf" x="130" y="168" width="44" height="55" transform="translate(130,168) scale(0.34)"/>
    <text x="130" y="190" text-anchor="middle" font-size="9" fill="#c8f07a" letter-spacing="2" font-family="Arial,sans-serif">RACHID</text>
  </g>
  <text x="350" y="300" text-anchor="middle" font-size="11" fill="#5ab535" font-family="Arial,sans-serif">BONÉ SNAPBACK</text>

  <!-- ==================== CANECA ==================== -->
  <g filter="url(#shadow)" transform="translate(460,80)">
    <!-- Corpo da caneca -->
    <path d="M40,80 L40,220 Q40,240 60,240 L160,240 Q180,240 180,220 L180,80Z"
          fill="url(#mugGrad)" stroke="#2d6b1a" stroke-width="1.5"/>
    <!-- Alça -->
    <path d="M180,120 Q225,120 225,160 Q225,200 180,200" fill="none" stroke="#2d6b1a" stroke-width="8" stroke-linecap="round"/>
    <path d="M180,120 Q215,120 215,160 Q215,200 180,200" fill="none" stroke="#0d1a0d" stroke-width="4" stroke-linecap="round"/>
    <!-- Fundo da caneca -->
    <ellipse cx="110" cy="240" rx="70" ry="8" fill="#0d1a0d" opacity="0.5"/>
    <!-- Arte na caneca -->
    <use href="#leaf" x="110" y="155" width="70" height="90" transform="translate(110,155) scale(0.52)"/>
    <text x="110" y="205" text-anchor="middle" font-size="12" fill="#c8f07a" letter-spacing="2" font-family="Georgia,serif">RACHID</text>
    <text x="110" y="220" text-anchor="middle" font-size="7" fill="#5ab535" letter-spacing="2" font-family="Arial,sans-serif">HEAD SHOP</text>
    <!-- Brilho -->
    <path d="M55,95 Q65,85 65,130" stroke="rgba(255,255,255,0.07)" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  <text x="600" y="300" text-anchor="middle" font-size="11" fill="#5ab535" font-family="Arial,sans-serif">CANECA VERDE ESCURO</text>

  <!-- ==================== ADESIVOS ==================== -->
  <!-- Adesivo redondo -->
  <g filter="url(#shadow)" transform="translate(790,85)">
    <circle cx="65" cy="80" r="62" fill="#0d1a0d" stroke="#5ab535" stroke-width="3"/>
    <circle cx="65" cy="80" r="55" fill="none" stroke="#2d6b1a" stroke-width="1" stroke-dasharray="3 2"/>
    <use href="#leaf" x="65" y="65" width="55" height="70" transform="translate(65,65) scale(0.43)"/>
    <text x="65" y="118" text-anchor="middle" font-size="10" fill="#c8f07a" letter-spacing="3" font-family="Arial,sans-serif">RACHID</text>
    <text x="65" y="131" text-anchor="middle" font-size="7" fill="#5ab535" letter-spacing="2" font-family="Arial,sans-serif">HEAD SHOP</text>
  </g>
  <!-- Adesivo hexagonal -->
  <g filter="url(#shadow)" transform="translate(800,215)">
    <polygon points="60,0 110,28 110,84 60,112 10,84 10,28" fill="#0d1a0d" stroke="#5ab535" stroke-width="2.5"/>
    <use href="#leaf" x="60" y="56" width="48" height="62" transform="translate(60,56) scale(0.38)"/>
    <text x="60" y="95" text-anchor="middle" font-size="8.5" fill="#c8f07a" letter-spacing="2" font-family="Arial,sans-serif">RACHID</text>
  </g>
  <text x="870" y="345" text-anchor="middle" font-size="11" fill="#5ab535" font-family="Arial,sans-serif">ADESIVOS</text>

  <!-- ==================== BUTTON / PIN ==================== -->
  <g filter="url(#shadow)" transform="translate(30,340)">
    <circle cx="55" cy="55" r="52" fill="#0a120a" stroke="#4a9e2f" stroke-width="3"/>
    <circle cx="55" cy="55" r="44" fill="#111f11"/>
    <use href="#leaf" x="55" y="44" width="44" height="56" transform="translate(55,44) scale(0.34)"/>
    <text x="55" y="82" text-anchor="middle" font-size="8" fill="#c8f07a" letter-spacing="2" font-family="Arial,sans-serif">RACHID HS</text>
    <!-- Brilho do button -->
    <path d="M25,28 Q38,18 52,22" stroke="rgba(255,255,255,0.15)" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
  <text x="85" y="420" text-anchor="middle" font-size="11" fill="#5ab535" font-family="Arial,sans-serif">BUTTON / PIN</text>

  <!-- ==================== SACOLA / EMBALAGEM ==================== -->
  <g filter="url(#shadow)" transform="translate(155,340)">
    <!-- Sacola -->
    <rect x="20" y="50" width="130" height="110" rx="6" fill="#111f11" stroke="#2d6b1a" stroke-width="1.5"/>
    <!-- Alças -->
    <path d="M50,50 Q50,20 65,20 Q80,20 80,50" fill="none" stroke="#2d6b1a" stroke-width="3" stroke-linecap="round"/>
    <path d="M90,50 Q90,20 105,20 Q120,20 120,50" fill="none" stroke="#2d6b1a" stroke-width="3" stroke-linecap="round"/>
    <!-- Arte na sacola -->
    <use href="#leaf" x="85" y="108" width="60" height="76" transform="translate(85,108) scale(0.46)"/>
    <text x="85" y="143" text-anchor="middle" font-size="11" fill="#c8f07a" letter-spacing="2" font-family="Georgia,serif">RACHID</text>
    <text x="85" y="156" text-anchor="middle" font-size="7" fill="#5ab535" letter-spacing="1.5" font-family="Arial,sans-serif">HEAD SHOP</text>
  </g>
  <text x="240" y="490" text-anchor="middle" font-size="11" fill="#5ab535" font-family="Arial,sans-serif">SACOLA KRAFT</text>

  <!-- ==================== CAIXA / BOX ==================== -->
  <g filter="url(#shadow)" transform="translate(370,330)">
    <!-- Face frontal -->
    <rect x="20" y="60" width="130" height="110" rx="4" fill="#111f11" stroke="#2d6b1a" stroke-width="1.5"/>
    <!-- Tampa isométrica -->
    <path d="M20,60 L50,38 L180,38 L150,60Z" fill="#0d1a0d" stroke="#2d6b1a" stroke-width="1.2"/>
    <!-- Lateral isométrica -->
    <path d="M150,60 L180,38 L180,148 L150,170Z" fill="#0a150a" stroke="#2d6b1a" stroke-width="1.2"/>
    <!-- Arte na caixa -->
    <use href="#leaf" x="85" y="115" width="52" height="66" transform="translate(85,115) scale(0.4)"/>
    <text x="85" y="150" text-anchor="middle" font-size="10" fill="#c8f07a" letter-spacing="2" font-family="Arial,sans-serif">RACHID</text>
    <text x="85" y="163" text-anchor="middle" font-size="6.5" fill="#5ab535" letter-spacing="1.5" font-family="Arial,sans-serif">HEAD SHOP</text>
  </g>
  <text x="470" y="490" text-anchor="middle" font-size="11" fill="#5ab535" font-family="Arial,sans-serif">CAIXA / EMBALAGEM</text>

  <!-- ==================== ISQUEIRO ==================== -->
  <g filter="url(#shadow)" transform="translate(610,345)">
    <rect x="30" y="25" width="60" height="95" rx="8" fill="#0d1a0d" stroke="#4a9e2f" stroke-width="2"/>
    <!-- Ranhura do isqueiro -->
    <rect x="38" y="20" width="44" height="14" rx="4" fill="#111f11" stroke="#2d6b1a" stroke-width="1"/>
    <rect x="52" y="14" width="16" height="9" rx="3" fill="#0d1a0d" stroke="#2d6b1a" stroke-width="0.8"/>
    <!-- Chama -->
    <path d="M60,10 Q56,0 60,-8 Q65,0 64,10Z" fill="#f5a623" opacity="0.9"/>
    <path d="M60,8 Q58,2 60,-4 Q62,2 62,8Z" fill="#fff176" opacity="0.8"/>
    <!-- Arte no isqueiro -->
    <use href="#leaf" x="60" y="78" width="35" height="44" transform="translate(60,78) scale(0.27)"/>
    <text x="60" y="100" text-anchor="middle" font-size="7" fill="#c8f07a" letter-spacing="1" font-family="Arial,sans-serif">RACHID</text>
    <text x="60" y="111" text-anchor="middle" font-size="5" fill="#5ab535" letter-spacing="1" font-family="Arial,sans-serif">HEAD SHOP</text>
  </g>
  <text x="690" y="490" text-anchor="middle" font-size="11" fill="#5ab535" font-family="Arial,sans-serif">ISQUEIRO</text>

  <!-- ==================== MOLETOM ==================== -->
  <g filter="url(#shadow)" transform="translate(770,330)">
    <path d="M55,80 L15,60 L0,130 L35,140 L35,250 L165,250 L165,140 L200,130 L185,60 L145,80
             C130,62 70,62 55,80Z"
          fill="#111f11" stroke="#2d6b1a" stroke-width="1.5"/>
    <!-- Gola moletom -->
    <path d="M75,65 Q100,90 125,65" fill="none" stroke="#2d6b1a" stroke-width="2.5"/>
    <!-- Bolso canguru -->
    <rect x="60" y="175" width="80" height="45" rx="5" fill="#0d1a0d" stroke="#1e3a1e" stroke-width="1"/>
    <!-- Logo no moletom -->
    <use href="#leaf" x="100" y="148" width="56" height="70" transform="translate(100,148) scale(0.43)"/>
    <text x="100" y="185" text-anchor="middle" font-size="9" fill="#c8f07a" letter-spacing="2" font-family="Arial,sans-serif">RACHID</text>
  </g>
  <text x="870" y="490" text-anchor="middle" font-size="11" fill="#5ab535" font-family="Arial,sans-serif">MOLETOM</text>

  <!-- Paleta de cores -->
  <rect x="80" y="530" width="840" height="1" fill="#2d6b1a" opacity="0.5"/>
  <text x="500" y="555" text-anchor="middle" font-size="10" fill="#4a9e2f" letter-spacing="4" font-family="Arial,sans-serif">PALETA DE CORES</text>
  <g transform="translate(200,570)">
    <rect x="0" y="0" width="50" height="50" rx="6" fill="#0d1a0d" stroke="#2d6b1a" stroke-width="1"/>
    <text x="25" y="65" text-anchor="middle" font-size="8" fill="#4a9e2f" font-family="Arial,sans-serif">#0d1a0d</text>
    <rect x="70" y="0" width="50" height="50" rx="6" fill="#111f11" stroke="#2d6b1a" stroke-width="1"/>
    <text x="95" y="65" text-anchor="middle" font-size="8" fill="#4a9e2f" font-family="Arial,sans-serif">#111f11</text>
    <rect x="140" y="0" width="50" height="50" rx="6" fill="#2d6b1a"/>
    <text x="165" y="65" text-anchor="middle" font-size="8" fill="#4a9e2f" font-family="Arial,sans-serif">#2d6b1a</text>
    <rect x="210" y="0" width="50" height="50" rx="6" fill="#5ab535"/>
    <text x="235" y="65" text-anchor="middle" font-size="8" fill="#5ab535" font-family="Arial,sans-serif">#5ab535</text>
    <rect x="280" y="0" width="50" height="50" rx="6" fill="#9de870"/>
    <text x="305" y="65" text-anchor="middle" font-size="8" fill="#9de870" font-family="Arial,sans-serif">#9de870</text>
    <rect x="350" y="0" width="50" height="50" rx="6" fill="#c8f07a"/>
    <text x="375" y="65" text-anchor="middle" font-size="8" fill="#c8f07a" font-family="Arial,sans-serif">#c8f07a</text>
  </g>
</svg>
