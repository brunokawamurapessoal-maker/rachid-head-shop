<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2e1a"/>
      <stop offset="100%" stop-color="#0d1a0d"/>
    </radialGradient>
    <radialGradient id="leafGrad" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#7ec850"/>
      <stop offset="60%" stop-color="#4a9e2f"/>
      <stop offset="100%" stop-color="#2d6b1a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo circular -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" stroke="#4a9e2f" stroke-width="2.5"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#2d6b1a" stroke-width="0.8" stroke-dasharray="4 3"/>

  <!-- Folha de cannabis centralizada, grande -->
  <g transform="translate(200,195) scale(1.1)" filter="url(#softglow)">
    <!-- Folha central principal -->
    <path d="M0,-70 C-5,-50 -18,-40 -22,-20 C-14,-22 -8,-18 0,-5 C8,-18 14,-22 22,-20 C18,-40 5,-50 0,-70Z"
          fill="url(#leafGrad)" opacity="0.95"/>
    <!-- Pares de folhas laterais -->
    <!-- Par 1 (mais alto) -->
    <path d="M-5,-42 C-20,-48 -40,-38 -48,-20 C-34,-22 -20,-20 -10,-10 C-8,-22 -6,-33 -5,-42Z"
          fill="url(#leafGrad)" opacity="0.9"/>
    <path d="M5,-42 C20,-48 40,-38 48,-20 C34,-22 20,-20 10,-10 C8,-22 6,-33 5,-42Z"
          fill="url(#leafGrad)" opacity="0.9"/>
    <!-- Par 2 (médio) -->
    <path d="M-8,-22 C-28,-24 -55,-10 -58,12 C-42,6 -26,4 -14,10 C-10,-2 -8,-12 -8,-22Z"
          fill="url(#leafGrad)" opacity="0.85"/>
    <path d="M8,-22 C28,-24 55,-10 58,12 C42,6 26,4 14,10 C10,-2 8,-12 8,-22Z"
          fill="url(#leafGrad)" opacity="0.85"/>
    <!-- Par 3 (baixo) -->
    <path d="M-10,-2 C-30,2 -52,18 -50,40 C-36,30 -22,24 -12,24 C-10,14 -10,6 -10,-2Z"
          fill="url(#leafGrad)" opacity="0.8"/>
    <path d="M10,-2 C30,2 52,18 50,40 C36,30 22,24 12,24 C10,14 10,6 10,-2Z"
          fill="url(#leafGrad)" opacity="0.8"/>
    <!-- Caule -->
    <rect x="-2.5" y="0" width="5" height="55" rx="2.5" fill="#2d6b1a"/>
    <!-- Nervuras centrais -->
    <line x1="0" y1="-65" x2="0" y2="5" stroke="#2d6b1a" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Texto RACHID -->
  <text x="200" y="305"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="38"
        font-weight="700"
        fill="#c8f07a"
        text-anchor="middle"
        letter-spacing="8"
        filter="url(#glow)">RACHID</text>

  <!-- Linha decorativa sob RACHID -->
  <line x1="90" y1="314" x2="310" y2="314" stroke="#4a9e2f" stroke-width="1" opacity="0.7"/>

  <!-- Texto HEAD SHOP -->
  <text x="200" y="340"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        font-weight="400"
        fill="#7ec850"
        text-anchor="middle"
        letter-spacing="6">HEAD SHOP</text>

  <!-- Estrelinhas decorativas -->
  <text x="88" y="340" font-size="10" fill="#c8f07a" opacity="0.7">✦</text>
  <text x="305" y="340" font-size="10" fill="#c8f07a" opacity="0.7">✦</text>

  <!-- Slogan -->
  <text x="200" y="368"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10"
        fill="#4a9e2f"
        text-anchor="middle"
        letter-spacing="3"
        font-style="italic">cultura · qualidade · estilo</text>
</svg>
